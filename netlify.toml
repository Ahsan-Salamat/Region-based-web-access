[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route API check-access to the Netlify Serverless function
[[redirects]]
  from = "/api/check-access"
  to = "/.netlify/functions/check-access"
  status = 200

# SPA client-side routing fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
